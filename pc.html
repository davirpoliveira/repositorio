<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo</title>
    <style>
        .borderFlex {
            border: 1px solid black;
            display: flex;
            flex-direction: column;
            width: 20%;
            border-radius: 10%;
        }

        #mainCatalog {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
    </style>
</head>

<body>
    <main id="mainCatalog">

    </main>
    <script>
        const catalogPrdoutos =
            [
                ['Notebook Dell', 'Notebook Dell i7 14" 500GB SSD ', 'Notebook', 7889.8],
                ['Notebook Lenovo', 'I5 15" 250GB', 'Notebok', 6534.2],
                ['Nintendo Swich', 'Video Game CPU Integrada Armazenamento de 32GB 4GB RAM', 'VideoGame', 2302.5],
                ['PlayStation 1', 'MIPS R4600A, Memoria 256MB RAM', 'VideoGame', 540.3,],
                ['PlayStation 2', '294MHz, Memoria 32MB RAM', 'VideoGame', 653,40]
            ];

        const mainCatalog = document.getElementById('mainCatalog');


        catalogPrdoutos.forEach((produtos) => catalogo(produtos));


        function catalogo(produto) {

            const boxProduto = document.createElement('div');
            boxProduto.setAttribute('class', 'borderFlex');

            const nome = document.createElement('h2');
            nome.textContent = produto[0];

            const descricao = document.createElement('p');
            descricao.textContent = produto[1];

            const categoria = document.createElement('p');
            categoria.textContent = produto[2];

            const preco = document.createElement('p');
            preco.textContent = `R$ ${produto[3].toFixed(2)}`;
            

            boxProduto.append(nome, descricao, categoria, preco);

            mainCatalog.append(boxProduto);

        }



    </script>
</body>

</html>
